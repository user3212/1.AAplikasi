name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Offline Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: |
          chmod +x gradlew
          if ! jar tf gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1; then
            echo "Warning: gradle-wrapper.jar appears corrupt or invalid. Regenerating wrapper..."
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi

      - name: Build Release APK with Gradle Wrapper
        run: ./gradlew clean assembleRelease --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Guruqu-Offline-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
