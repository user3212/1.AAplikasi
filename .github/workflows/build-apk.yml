name: Build Guruqu 1.3 Web Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Guruqu v1.3 Offline Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION="9.3.1"
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          /opt/gradle-${GRADLE_VERSION}/bin/gradle --version

      - name: Create CI debug keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Guruqu 1.3 Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle clean assembleRelease \
            --no-daemon \
            --no-parallel \
            --no-configuration-cache \
            --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=out-of-process \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:+UseG1GC"

      - name: Verify APK identity, alignment and signature
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt2" dump badging "$apk" | grep -F "package: name='com.guruqu.pesantren.offline' versionCode='4' versionName='1.3'"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$apk"
          sha256sum "$apk" | tee app/build/outputs/apk/release/SHA256SUMS.txt
          ls -lh "$apk" app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Upload Guruqu 1.3 Web Release Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Guruqu-Web-Release-APK-v1.3
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
