name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Offline Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        # To fix the KSP "ApplicationManager.getApplication() is null" error in GitHub Actions:
        # 1. --no-daemon: Prevents lingering daemon state issues.
        # 2. --no-parallel: Prevents KSP tasks from racing.
        # 3. --no-configuration-cache: Configuration cache on CI often causes KSP bugs.
        # 4. -Pkotlin.compiler.execution.strategy=out-of-process: Forces Kotlin compiler to run isolated.
        # 5. --max-workers=2: Limits concurrency to prevent OOM kills.
        run: ./gradlew clean assembleRelease --no-daemon --no-parallel --no-configuration-cache --max-workers=2 -Pkotlin.compiler.execution.strategy=out-of-process -Dorg.gradle.jvmargs="-Xmx5g -XX:+UseG1GC"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
