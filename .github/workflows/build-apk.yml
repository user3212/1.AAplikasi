name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Offline Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION="9.3.1"
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          /opt/gradle-${GRADLE_VERSION}/bin/gradle --version

      - name: Build Release APK
        # The repository Gradle Wrapper JAR is currently rejected by GitHub's
        # wrapper validation. Use the official Gradle 9.3.1 distribution directly
        # so the APK build is not blocked by that stale/corrupt wrapper JAR.
        # Keep the conservative CI flags to reduce KSP/IDE-state and memory issues.
        run: |
          gradle clean assembleRelease \
            --no-daemon \
            --no-parallel \
            --no-configuration-cache \
            --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=out-of-process \
            -Dorg.gradle.jvmargs="-Xmx5g -XX:+UseG1GC"

      - name: Verify Release APK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "ERROR: Release APK was not produced."
            exit 1
          fi
          echo "Release APK(s) produced:"
          ls -lh "${apks[@]}"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
